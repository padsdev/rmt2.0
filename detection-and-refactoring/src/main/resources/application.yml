spring:
  threads:
    virtual:
      enabled: true
  cloud:
    aws:
      credentials:
        instance-profile: false
      endpoint: ${LOCAL_STACK_HOST:http://127.0.0.1:4566}
      region:
        static: sa-east-1
      s3:
        path-style-access-enabled: true
  data:
    redis:
      host:  ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

s3:
  project-bucket: projects
  refactored-project-bucket: refactored-projects

rqueue:
  enabled: true

queue:
  detect-pattern: detect-pattern
  measure-pattern: measure-pattern

rmt:
  ai:
    enabled: ${RMT_AI_ENABLED:false}
    base-url: ${RMT_AI_BASE_URL:http://127.0.0.1:8000}
    analyze-path: ${RMT_AI_ANALYZE_PATH:/api/v1/analyze}
    connect-timeout: ${RMT_AI_CONNECT_TIMEOUT:500ms}
    read-timeout: ${RMT_AI_READ_TIMEOUT:120s}

server:
  port: 8081


