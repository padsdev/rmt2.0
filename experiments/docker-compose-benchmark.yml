version: "3.8"

services:
  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME-localstack_cloud}"
    image: localstack/localstack:3.0.2
    hostname: localstack
    ports:
      - "127.0.0.1:4510-4530:4510-4530"
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4571:4571"
    environment:
      - AWS_DEFAULT_REGION=sa-east-1
      - AWS_ACCESS_KEY_ID=fakeAccessKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
      - LOCALSTACK_API_KEY=${LOCALSTACK_API_KEY-}  # only required for Pro
      - HOST_TMP_FOLDER=${TMPDIR:-/tmp/}localstack
      - DEFAULT_REGION=sa-east-1
      - http_proxy=
      - https_proxy=
      - SERVICES=${SERVICES-}
      - DEBUG=${DEBUG-}
      - DATA_DIR=${DATA_DIR-}
      - LAMBDA_EXECUTOR=${LAMBDA_EXECUTOR-}
      - LOCALSTACK_API_KEY=${LOCALSTACK_API_KEY-}  # only required for Pro
      - HOST_TMP_FOLDER=${TMPDIR:-/tmp/}localstack
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  redis:
    image: redis:7.2.4-alpine
    ports:
      - '6379:6379'

  ai-service:
    image: magnus/rmt-ai-service
    build:
      context: ../../rmt-ai-module/rmt-ai-service
      dockerfile: Dockerfile
    environment:
      - RMT_AI_BACKEND_MODE=${RMT_AI_BACKEND_MODE:-stub}
      - RMT_AI_GRAPHCODEBERT_MODEL_NAME=${RMT_AI_GRAPHCODEBERT_MODEL_NAME:-microsoft/graphcodebert-base}
      - RMT_AI_FINETUNED_ARTIFACT_PATH=${RMT_AI_FINETUNED_ARTIFACT_PATH:-}
      - RMT_AI_MODEL_MAX_LENGTH=${RMT_AI_MODEL_MAX_LENGTH:-512}
      - RMT_AI_DEVICE_PREFERENCE=${RMT_AI_DEVICE_PREFERENCE:-auto}
      - RMT_AI_EXPERIMENT_PROFILE=${RMT_AI_EXPERIMENT_PROFILE:-default}
      - RMT_AI_THRESHOLD_TEMPLATE_METHOD=${RMT_AI_THRESHOLD_TEMPLATE_METHOD:-}
      - RMT_AI_THRESHOLD_STRATEGY=${RMT_AI_THRESHOLD_STRATEGY:-}
      - RMT_AI_THRESHOLD_FACTORY_METHOD=${RMT_AI_THRESHOLD_FACTORY_METHOD:-}
    volumes:
      - ../../:/home/pads/Documents/rmt2.0
      - ../../experiments/artifacts:/artifacts:ro

  intermediary:
    image: magnus/manager
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AWS_ACCESS_KEY_ID=fakeAccessKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
      - REDIS_HOST=redis
      - LOCAL_STACK_HOST=http://localstack:4566
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - localstack

  detection:
    image: magnus/detection
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AWS_ACCESS_KEY_ID=fakeAccessKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
      - REDIS_HOST=redis
      - LOCAL_STACK_HOST=http://localstack:4566
      - RMT_AI_ENABLED=true
      - RMT_AI_BASE_URL=http://ai-service:8000
      - RMT_AI_CONNECT_TIMEOUT=${RMT_AI_CONNECT_TIMEOUT:-500ms}
      - RMT_AI_READ_TIMEOUT=${RMT_AI_READ_TIMEOUT:-2s}
      - RMT_AI_SHADOW_EXPORT_PATH=/shadow-target/rmt-ai-shadow-observations.jsonl
      - RMT_EXPERIMENT_RUN_ID=${RMT_EXPERIMENT_RUN_ID:-}
    volumes:
      - ../../detection-and-refactoring/target:/shadow-target
    depends_on:
      - redis
      - localstack
      - ai-service

  metrics:
    image: magnus/metrics
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AWS_ACCESS_KEY_ID=fakeAccessKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
      - REDIS_HOST=redis
      - LOCAL_STACK_HOST=http://localstack:4566
    depends_on:
      - redis
      - localstack

networks:
  default:
    external: true
    name: local_default
