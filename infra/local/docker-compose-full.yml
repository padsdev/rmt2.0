version: "3.8"

services:
  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME-localstack_cloud}"
    image: localstack/localstack:3.0.2
    hostname: localstack
    ports:
      - "127.0.0.1:4510-4530:4510-4530"
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4571:4571"
    environment:
      - AWS_DEFAULT_REGION=sa-east-1
      - AWS_ACCESS_KEY_ID=fakeAccessKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
      - LOCALSTACK_API_KEY=${LOCALSTACK_API_KEY-}  # only required for Pro
      - HOST_TMP_FOLDER=${TMPDIR:-/tmp/}localstack
      - DEFAULT_REGION=sa-east-1
      - http_proxy=
      - https_proxy=
      - SERVICES=${SERVICES-}
      - DEBUG=${DEBUG-}
      - DATA_DIR=${DATA_DIR-}
      - LAMBDA_EXECUTOR=${LAMBDA_EXECUTOR-}
      - LOCALSTACK_API_KEY=${LOCALSTACK_API_KEY-}  # only required for Pro
      - HOST_TMP_FOLDER=${TMPDIR:-/tmp/}localstack
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  redis:
    image: redis:7.2.4-alpine
    ports:
      - '6379:6379'

  intermediary:
    image: magnus/manager
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AWS_ACCESS_KEY_ID=fakeAccessKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
      - REDIS_HOST=redis
      - LOCAL_STACK_HOST=http://localstack:4566
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - localstack

  # GraphCodeBERT inference (HTTP contract matches detection HttpRmtAiClient).
  # Run modes Classic | Shadow | AI_ONLY_FILTER are per-project metadata on BaseProject; one detection container handles all.
  # Classic skips AI calls in Java; Shadow and AI_ONLY_FILTER use this service when RMT_AI_ENABLED=true.
  rmt-ai:
    image: magnus/rmt-ai
    build:
      context: ../../rmt-ai-module/rmt-ai-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - RMT_AI_BACKEND=${RMT_AI_BACKEND:-transformers}
      - RMT_AI_MODEL_NAME=${RMT_AI_MODEL_NAME:-microsoft/graphcodebert-base}
      - RMT_AI_DECISION_THRESHOLD=${RMT_AI_DECISION_THRESHOLD:-0.35}
    depends_on:
      - redis

  detection:
    image: magnus/detection
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AWS_ACCESS_KEY_ID=fakeAccessKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
      - REDIS_HOST=redis
      - LOCAL_STACK_HOST=http://localstack:4566
      - RMT_AI_ENABLED=true
      - RMT_AI_BASE_URL=http://rmt-ai:8000
      - RMT_AI_READ_TIMEOUT=120s
    depends_on:
      - redis
      - localstack
      - rmt-ai

  metrics:
    image: magnus/metrics
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AWS_ACCESS_KEY_ID=fakeAccessKeyId
      - AWS_SECRET_ACCESS_KEY=fakeSecretAccessKey
      - REDIS_HOST=redis
      - LOCAL_STACK_HOST=http://localstack:4566
    depends_on:
      - redis
      - localstack
